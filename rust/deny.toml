# cargo-deny policy for the ChartWarden Rust workspace (CW-RUST-M02 AT-M02-07).
# Run: cargo deny --locked check   (a failure to fetch the advisory database fails the check; it is never skipped)

[graph]
all-features = true

[advisories]
# RustSec advisory database. Any vulnerability fails; unmaintained/unsound crates fail when reachable from our crates.
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
# ChartWarden is proprietary: permissive licences only, no copyleft (GPL/LGPL/AGPL/MPL/EPL/CDDL…).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# Our own crates are `publish = false` and carry `LicenseRef-Proprietary`.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
